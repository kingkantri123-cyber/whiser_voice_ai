<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Usage Console</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --ok: #3ecf8e;
    --warn: #f5a623;
    --bad: #f0556b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  input[type="text"], select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
  }
  select { cursor: pointer; }
  main { padding: 20px 24px 60px; max-width: 1200px; margin: 0 auto; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .tile .value { font-size: 22px; font-weight: 600; }
  .tile .sub { color: var(--muted); font-size: 11px; margin-top: 4px; }

  .strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .strip .item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .strip .item .label { color: var(--muted); font-size: 11px; }
  .strip .item .value { font-size: 16px; font-weight: 600; margin-top: 2px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 13px;
    margin: 0;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 16px; font-size: 13px; white-space: nowrap; }
  thead th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr:last-child { border-bottom: none; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.success { background: rgba(62,207,142,0.15); color: var(--ok); }
  .badge.fallback { background: rgba(245,166,35,0.15); color: var(--warn); }
  .badge.failed { background: rgba(240,85,107,0.15); color: var(--bad); }

  /* Drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: stretch; justify-content: flex-end; z-index: 10;
  }
  .overlay.open { display: flex; }
  .drawer {
    width: min(560px, 100%);
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 22px 60px;
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .drawer-head h3 { margin: 0 0 4px; font-size: 16px; }
  .drawer-head .sub { color: var(--muted); font-size: 12px; }
  .close-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }

  .pipeline { display: flex; align-items: center; gap: 6px; margin: 16px 0 20px; overflow-x: auto; }
  .pnode { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 58px; }
  .pnode .dot { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 2px solid var(--border); }
  .pnode .dot.ok { border-color: var(--ok); }
  .pnode .dot.bad { border-color: var(--bad); }
  .pnode .lbl { font-size: 10px; color: var(--muted); }
  .parrow { color: var(--muted); font-size: 14px; }

  .stage-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .stage-card h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv div span { color: var(--muted); }
  .err-line { margin-top: 6px; color: var(--bad); font-size: 12px; }

  .turn-block { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel-2); }
  .turn-block .thead { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .toolchip { display: inline-flex; align-items: center; gap: 4px; background: rgba(91,140,255,0.12); color: var(--accent); border-radius: 6px; padding: 2px 8px; font-size: 11px; margin: 2px 4px 0 0; }
  .toolchip.bad { background: rgba(240,85,107,0.12); color: var(--bad); }
  .toolchip.dup { background: rgba(245,166,35,0.15); color: var(--warn); }

  .bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; margin-top: 8px; }
  .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
  .bar .n { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font-size: 10px; color: var(--muted); }

  .breakdown { display: flex; height: 18px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .breakdown span { height: 100%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Usage Console</h1>
    <div class="sub">Voice pipeline observability — STT → LLM → TTS</div>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search session, model, status..." />
    <select id="range">
      <option value="today">Today</option>
      <option value="yesterday">Yesterday</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="all" selected>All time</option>
    </select>
  </div>
</header>

<main>
  <div class="tiles" id="tiles"></div>
  <div class="strip" id="latencyStrip"></div>

  <div class="panel">
    <h2>Recent Calls</h2>
    <div id="tableWrap"></div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<script>
const state = { records: [], filtered: [], search: "", range: "all" };

async function load() {
  const res = await fetch("/api/usage");
  const data = await res.json();
  state.records = data.records || [];
  applyFilters();
}

function inRange(ts, range) {
  const t = new Date(ts).getTime();
  const now = new Date();
  const startOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  if (range === "all") return true;
  if (range === "today") return t >= startOf(now);
  if (range === "yesterday") {
    const y = new Date(now); y.setDate(y.getDate() - 1);
    return t >= startOf(y) && t < startOf(now);
  }
  if (range === "7d") return t >= now.getTime() - 7 * 86400000;
  if (range === "30d") return t >= now.getTime() - 30 * 86400000;
  return true;
}

function turnStatus(r) {
  if (r.status === "failed") return "failed";
  if (r.status === "fallback") return "fallback";
  return "success";
}

function groupBySession(records) {
  const map = new Map();
  for (const r of records) {
    if (!map.has(r.sessionId)) map.set(r.sessionId, []);
    map.get(r.sessionId).push(r);
  }
  return Array.from(map.entries()).map(([sessionId, turns]) => {
    turns.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    const statuses = turns.map(turnStatus);
    const status = statuses.includes("failed") ? "failed" : statuses.includes("fallback") ? "fallback" : "success";
    return {
      sessionId,
      turns,
      firstTs: turns[0].timestamp,
      durationMs: turns.reduce((s, t) => s + (t.durationMs || 0), 0),
      sttSeconds: turns.reduce((s, t) => s + (t.stt?.audioSeconds || 0), 0),
      inputTokens: turns.reduce((s, t) => s + (t.llm?.inputTokens || 0), 0),
      outputTokens: turns.reduce((s, t) => s + (t.llm?.outputTokens || 0), 0),
      ttsChars: turns.reduce((s, t) => s + (t.tts?.characters || 0), 0),
      model: turns.find((t) => t.llm?.model)?.llm?.model || "-",
      status,
    };
  }).sort((a, b) => new Date(b.firstTs) - new Date(a.firstTs));
}

function applyFilters() {
  const inRangeRecords = state.records.filter((r) => inRange(r.timestamp, state.range));
  let sessions = groupBySession(inRangeRecords);
  const q = state.search.trim().toLowerCase();
  if (q) {
    sessions = sessions.filter((s) =>
      s.sessionId.toLowerCase().includes(q) ||
      s.model.toLowerCase().includes(q) ||
      s.status.toLowerCase().includes(q)
    );
  }
  state.filtered = sessions;
  state.visibleTurns = inRangeRecords;
  renderTiles(inRangeRecords);
  renderLatencyStrip(inRangeRecords);
  renderTable(sessions);
}

function fmt(n, d = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return "-";
  return Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
}

function renderTiles(turns) {
  const calls = groupBySession(turns).length;
  const sttSeconds = turns.reduce((s, t) => s + (t.stt?.audioSeconds || 0), 0);
  const inputTokens = turns.reduce((s, t) => s + (t.llm?.inputTokens || 0), 0);
  const outputTokens = turns.reduce((s, t) => s + (t.llm?.outputTokens || 0), 0);
  const ttsChars = turns.reduce((s, t) => s + (t.tts?.characters || 0), 0);
  const fallbackCalls = turns.filter((t) => t.tts?.usedFallback).length;

  const tiles = [
    { label: "Voice Calls", value: fmt(calls) },
    { label: "STT Seconds Processed", value: fmt(sttSeconds, 1) },
    { label: "LLM Tokens", value: fmt(inputTokens + outputTokens), sub: `${fmt(inputTokens)} in / ${fmt(outputTokens)} out` },
    { label: "TTS Characters", value: fmt(ttsChars) },
    { label: "Fallback TTS Calls", value: fmt(fallbackCalls) },
  ];
  document.getElementById("tiles").innerHTML = tiles.map((t) => `
    <div class="tile">
      <div class="label">${t.label}</div>
      <div class="value">${t.value}</div>
      ${t.sub ? `<div class="sub">${t.sub}</div>` : ""}
    </div>
  `).join("");
}

function avg(arr) {
  const vals = arr.filter((v) => typeof v === "number");
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function renderLatencyStrip(turns) {
  const stt = avg(turns.map((t) => t.stt?.latencyMs));
  const llm = avg(turns.map((t) => t.llm?.latencyMs));
  const tts = avg(turns.map((t) => t.tts?.latencyMs));
  const full = avg(turns.map((t) => t.durationMs));
  const items = [
    { label: "Avg STT Latency", value: stt !== null ? `${fmt(stt)} ms` : "-" },
    { label: "Avg LLM Latency", value: llm !== null ? `${fmt(llm)} ms` : "-" },
    { label: "Avg TTS Latency", value: tts !== null ? `${fmt(tts)} ms` : "-" },
    { label: "Avg Full Pipeline", value: full !== null ? `${fmt(full)} ms` : "-" },
  ];
  document.getElementById("latencyStrip").innerHTML = items.map((i) => `
    <div class="item"><div class="label">${i.label}</div><div class="value">${i.value}</div></div>
  `).join("");
}

function badge(status) {
  const map = { success: ["success", "✓ success"], fallback: ["fallback", "⚠ fallback"], failed: ["failed", "✕ failed"] };
  const [cls, label] = map[status] || ["success", status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderTable(sessions) {
  const wrap = document.getElementById("tableWrap");
  if (!sessions.length) {
    wrap.innerHTML = `<div class="empty">No calls in this range.</div>`;
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Time</th><th>Session</th><th>Duration</th><th>STT (s)</th>
          <th>LLM Tokens</th><th>TTS Chars</th><th>Model</th><th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${sessions.map((s) => `
          <tr data-session="${s.sessionId}">
            <td>${new Date(s.firstTs).toLocaleString()}</td>
            <td>${s.sessionId}</td>
            <td>${fmt(s.durationMs)} ms</td>
            <td>${fmt(s.sttSeconds, 1)}</td>
            <td>${fmt(s.inputTokens + s.outputTokens)}</td>
            <td>${fmt(s.ttsChars)}</td>
            <td>${s.model}</td>
            <td>${badge(s.status)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll("tbody tr").forEach((tr) => {
    tr.addEventListener("click", () => openDrawer(tr.dataset.session));
  });
}

const CATS = [
  { key: "systemPromptTokens", label: "System prompt", color: "#5b8cff" },
  { key: "recentConversationTokens", label: "Conversation", color: "#3ecf8e" },
  { key: "toolDataTokens", label: "Tool data", color: "#f5a623" },
  { key: "currentRequestTokens", label: "Current request", color: "#f0556b" },
];

function stageNode(label, icon, ok) {
  return `<div class="pnode"><div class="dot ${ok ? "ok" : "bad"}">${icon}</div><div class="lbl">${label}</div></div>`;
}

function openDrawer(sessionId) {
  const session = state.filtered.find((s) => s.sessionId === sessionId);
  if (!session) return;
  const turns = session.turns;
  const overallOk = session.status !== "failed";

  const pipelineHtml = `
    <div class="pipeline">
      ${stageNode("Caller", "🎤", true)}
      <span class="parrow">→</span>
      ${stageNode("STT", "🗣", !turns.some((t) => t.stt?.status === "error"))}
      <span class="parrow">→</span>
      ${stageNode("LLM", "🧠", !turns.some((t) => t.llm?.status === "error"))}
      <span class="parrow">→</span>
      ${stageNode("TTS", "🔤", !turns.some((t) => t.tts?.status === "error"))}
      <span class="parrow">→</span>
      ${stageNode("Speaker", "🔊", overallOk)}
    </div>
  `;

  const turnBlocks = turns.map((t, i) => {
    const seen = new Map();
    const toolChips = (t.llm?.toolCalls || []).map((c) => {
      const count = (seen.get(c.name) || 0) + 1;
      seen.set(c.name, count);
      const dup = count > 1;
      const cls = !c.ok ? "bad" : dup ? "dup" : "";
      return `<span class="toolchip ${cls}">${c.name}${dup ? ` ×${count}` : ""}${!c.ok ? " ✕" : ""}</span>`;
    }).join("");

    const bd = t.llm?.tokenBreakdown;
    let breakdownHtml = "";
    if (bd) {
      const total = CATS.reduce((s, c) => s + (bd[c.key] || 0), 0) || 1;
      breakdownHtml = `
        <div class="breakdown">
          ${CATS.map((c) => `<span style="width:${((bd[c.key] || 0) / total * 100).toFixed(1)}%;background:${c.color}"></span>`).join("")}
        </div>
        <div class="legend">
          ${CATS.map((c) => `<span><span class="sw" style="background:${c.color}"></span>${c.label}: ${fmt(bd[c.key] || 0)}</span>`).join("")}
        </div>
      `;
    }

    return `
      <div class="turn-block">
        <div class="thead">
          <span>Turn ${i + 1} · ${new Date(t.timestamp).toLocaleTimeString()}</span>
          ${badge(turnStatus(t))}
        </div>
        <div class="kv">
          <div><span>STT latency:</span> ${fmt(t.stt?.latencyMs)} ms</div>
          <div><span>LLM latency:</span> ${fmt(t.llm?.latencyMs)} ms</div>
          <div><span>TTS latency:</span> ${fmt(t.tts?.latencyMs)} ms</div>
          <div><span>Tool rounds:</span> ${fmt(t.llm?.rounds)}</div>
          <div><span>Input tokens:</span> ${fmt(t.llm?.inputTokens)}</div>
          <div><span>Output tokens:</span> ${fmt(t.llm?.outputTokens)}</div>
        </div>
        ${toolChips ? `<div style="margin-top:8px">${toolChips}</div>` : ""}
        ${breakdownHtml}
      </div>
    `;
  }).join("");

  const maxInput = Math.max(1, ...turns.map((t) => t.llm?.inputTokens || 0));
  const barsHtml = `
    <div class="bars">
      ${turns.map((t, i) => `
        <div class="bar" style="height:${Math.max(2, (t.llm?.inputTokens || 0) / maxInput * 90)}px">
          <span class="n">${fmt(t.llm?.inputTokens)}</span>
        </div>
      `).join("")}
    </div>
    <div class="legend">Input tokens per request (turn 1 → ${turns.length}) — watch for context growth</div>
  `;

  const errorLines = turns.flatMap((t) => {
    const lines = [];
    if (t.stt?.error) lines.push(`STT: ${t.stt.error}`);
    if (t.llm?.error) lines.push(`LLM: ${t.llm.error}`);
    if (t.tts?.error) lines.push(`TTS: ${t.tts.error}`);
    if (t.tts?.fallbackReason) lines.push(`TTS fallback reason: ${t.tts.fallbackReason}`);
    return lines;
  });

  document.getElementById("drawer").innerHTML = `
    <div class="drawer-head">
      <div>
        <h3>${sessionId}</h3>
        <div class="sub">${new Date(session.firstTs).toLocaleString()} · ${turns.length} turn(s) · ${badge(session.status)}</div>
      </div>
      <button class="close-btn" id="closeDrawer">✕</button>
    </div>
    ${pipelineHtml}
    ${errorLines.length ? `<div class="stage-card"><h4>Errors</h4>${errorLines.map((e) => `<div class="err-line">${e}</div>`).join("")}</div>` : ""}
    <div class="stage-card">
      <h4>Request-by-request input tokens</h4>
      ${barsHtml}
    </div>
    <div class="stage-card"><h4>Per-turn detail</h4></div>
    ${turnBlocks}
  `;
  document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
  document.getElementById("overlay").classList.add("open");
}

function closeDrawer() {
  document.getElementById("overlay").classList.remove("open");
}

document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeDrawer();
});
document.getElementById("search").addEventListener("input", (e) => {
  state.search = e.target.value;
  applyFilters();
});
document.getElementById("range").addEventListener("change", (e) => {
  state.range = e.target.value;
  applyFilters();
});

load();
</script>

</body>
</html>
