<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Ordering Agent</title>
    <meta name="description"
        content="AI-powered voice ordering agent — speak your order and let the agent handle the rest." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161922;
            --surface2: #1e2230;
            --border: #2a2f42;
            --accent: #6c63ff;
            --accent2: #a78bfa;
            --danger: #ef4444;
            --success: #22c55e;
            --text: #e8eaf0;
            --muted: #7b82a0;
            --radius: 14px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 960px;
            padding: 28px 20px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.4);
        }

        .header-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff 30%, var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-text p {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 2px;
        }

        #sessionBadge {
            margin-left: auto;
            font-size: 0.72rem;
            color: var(--muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            white-space: nowrap;
            display: none;
        }

        main {
            width: 100%;
            max-width: 960px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
            flex: 1;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
        }

        #chatLog {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 320px;
            max-height: 420px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        #chatLog::-webkit-scrollbar {
            width: 5px;
        }

        #chatLog::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .msg {
            padding: 11px 15px;
            border-radius: 12px;
            max-width: 85%;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            animation: fadeSlide 0.25s ease;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.user {
            background: #1e2e4a;
            border: 1px solid #2a3d5e;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.agent {
            background: #1c2030;
            border: 1px solid var(--border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg .label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .msg.user .label {
            color: #60a5fa;
        }

        .msg.agent .label {
            color: var(--accent2);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            gap: 10px;
            font-size: 0.85rem;
            text-align: center;
        }

        .empty-state .icon {
            font-size: 2.2rem;
            opacity: 0.5;
        }

        .controls {
            padding: 16px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #statusText {
            text-align: center;
            font-size: 0.82rem;
            color: var(--muted);
            min-height: 18px;
            transition: color 0.3s;
        }

        #statusText.listening {
            color: var(--danger);
        }

        #statusText.processing {
            color: var(--accent2);
        }

        #statusText.ready {
            color: var(--success);
        }

        #recordBtn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: white;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.35);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #recordBtn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(108, 99, 255, 0.5);
        }

        #recordBtn:active:not(:disabled) {
            transform: translateY(0);
        }

        #recordBtn.recording {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.45);
            animation: recPulse 1.5s ease-in-out infinite;
        }

        @keyframes recPulse {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.45);
            }

            50% {
                box-shadow: 0 4px 32px rgba(239, 68, 68, 0.75);
            }
        }

        #recordBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .wave {
            display: none;
            align-items: center;
            gap: 3px;
            height: 18px;
        }

        .wave.active {
            display: flex;
        }

        .wave span {
            display: block;
            width: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.9);
            animation: waveAnim 1s ease-in-out infinite;
        }

        .wave span:nth-child(1) {
            animation-delay: 0s;
            height: 6px;
        }

        .wave span:nth-child(2) {
            animation-delay: 0.1s;
            height: 14px;
        }

        .wave span:nth-child(3) {
            animation-delay: 0.2s;
            height: 9px;
        }

        .wave span:nth-child(4) {
            animation-delay: 0.3s;
            height: 16px;
        }

        .wave span:nth-child(5) {
            animation-delay: 0.15s;
            height: 7px;
        }

        @keyframes waveAnim {

            0%,
            100% {
                transform: scaleY(1);
            }

            50% {
                transform: scaleY(0.35);
            }
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        #cartTotal {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 14px;
        }

        #cartTotal span {
            color: var(--accent2);
        }

        #cartItems {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-left: 0;
        }

        #cartItems li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.85rem;
            animation: fadeSlide 0.2s ease;
        }

        #cartItems li .item-name {
            color: var(--text);
            font-weight: 500;
        }

        #cartItems li .item-qty {
            color: var(--muted);
            font-size: 0.78rem;
        }

        #cartItems li .item-price {
            color: var(--accent2);
            font-weight: 600;
        }

        .cart-empty {
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
            padding: 30px 0;
        }

        .cart-empty .icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.4;
        }

        #orderBanner {
            display: none;
            margin: 14px 16px 0;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.82rem;
            color: var(--success);
            font-weight: 600;
            text-align: center;
        }

        @media (max-width:680px) {
            main {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            #chatLog {
                max-height: 300px;
            }

            header {
                padding: 18px 14px 0;
            }

            .header-text h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">🍕</div>
        <div class="header-text">
            <h1>Voice Ordering Agent</h1>
            <p>Powered by Groq Whisper + Gemini</p>
        </div>
        <div id="sessionBadge">Session: —</div>
    </header>
    <main>
        <div class="panel">
            <div class="panel-header"><span class="dot"></span> Conversation</div>
            <div id="chatLog">
                <div class="empty-state" id="emptyState">
                    <span class="icon">🎙️</span>
                    <span>Press the button below and start speaking your order</span>
                </div>
            </div>
            <div class="controls">
                <div id="statusText">Initializing session…</div>
                <button id="recordBtn" disabled>
                    <span id="btnIcon">⏳</span>
                    <span id="btnLabel">Loading…</span>
                    <div class="wave" id="waveEl"><span></span><span></span><span></span><span></span><span></span>
                    </div>
                    <div class="spinner" id="spinner"></div>
                </button>
            </div>
        </div>
        <div class="panel">
            <div class="panel-header"><span class="dot" style="background:#22c55e;box-shadow:0 0 6px #22c55e"></span>
                Your Cart</div>
            <div id="orderBanner">✅ Order Placed!</div>
            <div class="cart-body">
                <div id="cartTotal">Total: <span>$0.00</span></div>
                <ul id="cartItems"></ul>
                <div class="cart-empty" id="cartEmpty"><span class="icon">🛒</span>Your cart is empty</div>
            </div>
        </div>
    </main>
    <audio id="agentAudio" style="display:none"></audio>
    <script>
        let sessionId = null, mediaRecorder = null, audioChunks = [], isRecording = false, isBusy = false;
        const recordBtn = document.getElementById('recordBtn'), btnIcon = document.getElementById('btnIcon'), btnLabel = document.getElementById('btnLabel'), waveEl = document.getElementById('waveEl'), spinnerEl = document.getElementById('spinner'), statusText = document.getElementById('statusText'), chatLog = document.getElementById('chatLog'), emptyState = document.getElementById('emptyState'), cartTotal = document.getElementById('cartTotal'), cartItems = document.getElementById('cartItems'), cartEmpty = document.getElementById('cartEmpty'), orderBanner = document.getElementById('orderBanner'), agentAudio = document.getElementById('agentAudio'), sessionBadge = document.getElementById('sessionBadge');
        function setStatus(msg, cls) { statusText.textContent = msg; statusText.className = cls ? cls : ''; }
        function appendMessage(text, sender) {
            if (!text) return;
            emptyState.style.display = 'none';
            const wrap = document.createElement('div'); wrap.className = 'msg ' + sender;
            const label = document.createElement('div'); label.className = 'label'; label.textContent = sender === 'user' ? '👤 You' : '🤖 Agent';
            const body = document.createElement('div'); body.textContent = text;
            wrap.appendChild(label); wrap.appendChild(body); chatLog.appendChild(wrap); chatLog.scrollTop = chatLog.scrollHeight;
        }
        function updateCart(cart) {
            if (!cart) return;
            const total = typeof cart.total === 'number' ? cart.total : 0;
            cartTotal.innerHTML = 'Total: <span>$' + total.toFixed(2) + '</span>';
            const lines = cart.lines || []; cartItems.innerHTML = '';
            if (lines.length === 0) { cartEmpty.style.display = 'block'; }
            else {
                cartEmpty.style.display = 'none';
                lines.forEach(function (line) {
                    const li = document.createElement('li');
                    li.innerHTML = '<div><div class="item-name">' + (line.itemName || line.name || 'Item') + '</div><div class="item-qty">\xd7' + line.quantity + '</div></div><div class="item-price">$' + (line.lineTotal || 0).toFixed(2) + '</div>';
                    cartItems.appendChild(li);
                });
            }
            if (cart.placed) { orderBanner.style.display = 'block'; setStatus('Order placed! 🎉', 'ready'); setBtnState('done'); }
        }
        function setBtnState(state) {
            recordBtn.disabled = false; waveEl.classList.remove('active'); spinnerEl.style.display = 'none'; recordBtn.classList.remove('recording'); btnIcon.style.display = 'inline';
            if (state === 'ready') { btnIcon.textContent = '🎙️'; btnLabel.textContent = 'Tap to Speak'; }
            else if (state === 'recording') { btnIcon.textContent = '⏹️'; btnLabel.textContent = 'Stop Recording'; recordBtn.classList.add('recording'); waveEl.classList.add('active'); }
            else if (state === 'processing') { btnIcon.style.display = 'none'; btnLabel.textContent = 'Processing…'; spinnerEl.style.display = 'inline-block'; recordBtn.disabled = true; }
            else if (state === 'loading') { btnIcon.textContent = '⏳'; btnLabel.textContent = 'Loading…'; recordBtn.disabled = true; }
            else if (state === 'done') { btnIcon.textContent = '✅'; btnLabel.textContent = 'Order Complete'; recordBtn.disabled = true; }
        }
        async function initSession() {
            try {
                // Create session
                const res = await fetch('/api/session', { method: 'POST' });
                if (!res.ok) throw new Error('Session error: ' + res.status);
                const data = await res.json(); sessionId = data.sessionId;
                sessionBadge.textContent = 'Session: ' + sessionId.substring(0, 8) + '…'; sessionBadge.style.display = 'block';
                setStatus('Connecting…', '');

                // Play welcome greeting automatically (like a real phone call)
                try {
                    setStatus('Connecting your call…', 'processing');
                    const greetRes = await fetch('/api/greet', { method: 'POST' });
                    if (greetRes.ok) {
                        const greetData = await greetRes.json();
                        appendMessage(greetData.text, 'agent');
                        await playBase64Audio(greetData.audioBase64);
                    }
                } catch (greetErr) {
                    console.warn('Greeting failed (non-fatal):', greetErr);
                }

                setStatus('Ready — press the button and speak', 'ready');
                setBtnState('ready');
            } catch (err) { setStatus('❌ Could not connect to server', ''); console.error(err); }
        }
        function getSupportedMimeType() {
            const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
            for (const t of types) { if (MediaRecorder.isTypeSupported(t)) return t; }
            return '';
        }
        recordBtn.addEventListener('click', async function () {
            if (isBusy) return;
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            noiseSuppression: true,
                            echoCancellation: true,
                            autoGainControl: true,
                            channelCount: 1
                        }
                    });
                    audioChunks = []; const mimeType = getSupportedMimeType();
                    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
                    mediaRecorder.ondataavailable = function (e) { if (e.data.size > 0) audioChunks.push(e.data); };
                    mediaRecorder.onstop = async function () { stream.getTracks().forEach(t => t.stop()); await sendAudio(); };
                    mediaRecorder.start(100); isRecording = true; setBtnState('recording'); setStatus('Listening… speak your order', 'listening');
                } catch (err) { alert('Microphone access is required. Please allow microphone in your browser.'); console.error(err); }
            } else { isRecording = false; mediaRecorder.stop(); }
        });
        async function sendAudio() {
            if (audioChunks.length === 0) { setBtnState('ready'); setStatus('No audio captured. Try again.', ''); return; }
            isBusy = true; setBtnState('processing'); setStatus('Transcribing & thinking…', 'processing');
            try {
                const mimeType = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
                const ext = mimeType.includes('ogg') ? 'ogg' : mimeType.includes('mp4') ? 'mp4' : 'webm';
                const blob = new Blob(audioChunks, { type: mimeType });
                const form = new FormData(); form.append('sessionId', sessionId); form.append('audio', blob, 'recording.' + ext);
                const res = await fetch('/api/voice-chat', { method: 'POST', body: form });
                if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || e.error || 'Server error ' + res.status); }
                const data = await res.json();
                if (data.userText) appendMessage(data.userText, 'user');
                if (data.replyText) appendMessage(data.replyText, 'agent');
                if (data.cart) updateCart(data.cart);
                if (data.audioBase64) await playBase64Audio(data.audioBase64);
                if (data.sessionStatus === 'ended' || (data.cart && data.cart.placed)) { setBtnState('done'); setStatus('Order placed! 🎉', 'ready'); }
                else { setBtnState('ready'); setStatus('Ready — press the button and speak', 'ready'); }
            } catch (err) { console.error(err); setStatus('❌ Error: ' + err.message, ''); appendMessage('⚠️ ' + err.message, 'agent'); setBtnState('ready'); }
            finally { isBusy = false; audioChunks = []; }
        }
        function playBase64Audio(base64) {
            return new Promise(function (resolve) {
                const byteChars = atob(base64), byteNums = new Uint8Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++)byteNums[i] = byteChars.charCodeAt(i);
                const blob = new Blob([byteNums], { type: 'audio/wav' }), url = URL.createObjectURL(blob);
                agentAudio.src = url;
                agentAudio.onended = function () { URL.revokeObjectURL(url); resolve(); };
                agentAudio.onerror = function () { URL.revokeObjectURL(url); resolve(); };
                agentAudio.play().catch(resolve);
            });
        }
        initSession();
    </script>
</body>

</html>
